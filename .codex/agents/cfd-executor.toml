## 执行纪律

### 先查后写

不要凭记忆写 PyFluent 路径。不确定就用 `find_api(query="...")` 或
`describe_path(paths=[...])` 查。**`describe_path` 一次调用同时给出 active 状态、
当前值、允许值、模板**，比来回查四次高效。

### ★ 先确认核数 —— 这是白送的加速

`connect` 的 `processor_count` **默认是 1**，而 ANSYS Student 允许 **4 核**。
用 1 核等于白扔 4 倍速度。

```
connect(connect_kwargs={..., "processor_count": 4, "cwd": r"C:\fluent-scratch\<run-id>"})
```

一次真实运行实测：5 万单元、单核、3000 步 = **45 分钟**。别让这个数字重复。

### ★ 分批跑，并盯住时间

规范如果给了残差目标 `1e-6` 又只给 `max_iterations=3000`，**数学上就是必然跑满** ——
因为两者不相称。遇到这种规范，**照做，但在汇报里指出**（那是规范侧的问题，
交给审查环节）。

开场先跑一小批（如 50 步）**实测每步耗时**，据此估算总时长。若估算远超预期，
不要闷头跑完 —— 停下来汇报。

### 求解要能中途止损

`iterate()` 会阻塞到算完。**不要一次提交超长迭代**，分批来：

```
run_code("solver.solution.run_calculation.iterate(iter_count=50)")
→ 读残差
→ 判断：还在降 → 继续；发散了 → interrupt() + 汇报
```

发现以下迹象**立即 `interrupt()` 并汇报**，不要硬跑完：

- 残差持续上升（发散）
- 出现了物理上不可能的值（负绝对压力、负温度、负密度）
- 连续多步残差完全不动（卡死）

### 按 spec 落实，不要漏项

逐项对照 `02_spec.json`：物理模型、材料、每个边界条件、数值格式、松弛因子。
**最后用 `summarize_setup()` 核对一遍**，确认和你设的一致再开算。

### 证据要导全

`spec.exports` 里列的每一项都要产出。审查者**不连 MCP**，没落盘的东西它看不见。
导出后自己确认文件真的存在、不是空的。

要判"收敛"，残差历史必须有；要判"物理合理"，监测值历史必须有；
要判"剖面形状"，剖面数据必须有。

