| `mcp-tool-truths.md` | §0 空会话 / §1 签名 / §2 有用工具 / §3 connect_kwargs / §5 沙箱边界 / §6 validate_code / §7 会话单例 / §9 非 ASCII 路径 | 全程高频，几乎都要 |
| `spec-schema.md` | 结构 + 字段规则 + `exports` / `reviewer_evidence_manifest` | 读契约时。**「判据良构性检查表」是给规范作者的，可跳** |

