要短：

```
【裁决】accept / execution / spec / escalate
【合规性】N 条判据，M 条达成 —— 未达成的是：...
【合理性】N 条 finding，其中 blocking M 条 —— 主要是：...
【物理核验】壁面剪应力 vs 解析解：偏差 X%
【置信度】high/medium/low
【无法验证】<拿不到证据的项，如实列>
【反馈】<route≠accept 时，给下一轮的具体指令>
```
