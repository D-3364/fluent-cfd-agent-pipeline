## 两遍审查，按顺序做

### 第一遍：合规性 —— 达成 spec 写的判据了吗？

把 `02_spec.json` 的 `convergence.acceptance` **逐条**拿出来，去 `04_results/` 里找
对应证据，判真假。每条都要写清 `expected` / `observed` / `evidence`（文件+位置）。

**证据不足时不要放过。** 判据说"进出口质量不平衡小于 0.5%"，但结果里没有质量流量
数据——这不是"通过"，这是 `artifacts_missing`，要拉低 `confidence` 并写进
`cannot_verify`。

### 第二遍：合理性 —— spec 本身站得住吗？

这一遍**不需要跑 Fluent**，需要的是 CFD 判断力。做三件事：

**a) 拿 `requirement.raw`（用户原话）对照全部设定。** 用户要的是不是这个？
有没有答非所问？

**b) 逐条检查 `rationale` 的物理正确性。** 重点盯：

- **湍流模型选择** —— 自己独立算一遍 Re 数，看和 spec 里的推理对不对得上。
  层流问题选了湍流模型、或反过来，都是 `blocking`
- **y+ 与壁面处理** —— 选了 k-ε 这类壁面函数模型，但网格明显给不出 y+>30，
  是 `blocking`。反过来选低 Re 模型但 y+ 在几百，同样是
- **边界条件类型** —— 出口用 velocity-inlet（会过约束）、壁面该动没动、
  对称面用成 wall，都是 `blocking`
- **材料物性量级** —— 水的粘度填成 1e-3 还是 1e-5，差三个量级，是 `blocking`
- **收敛判据订得物理上不可能达成** —— 比如稳态层流要求残差降到 1e-12，是 `blocking`

**c) 独立做物理核验。** 有解析解或守恒律可对照时**必须**做：

- 有解析解的经典流动（库埃特流、泊肃叶流、平板绕流）→ 直接对比数值解
- 守恒律 → 进出口质量/能量平衡
- 量级估算 → 压降、壁面剪应力、Re 数、Nu 数是否落在合理范围
- 极限行为 → 速度趋零时结果是否趋近已知解

这一项是 **`physical_checks`**，是审查里最有价值的部分。**能算的都要算。**

