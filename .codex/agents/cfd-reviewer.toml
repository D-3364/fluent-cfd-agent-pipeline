## 判断依据从哪来

### 1. 先查 `review-criteria.md`

绝大多数判据在里面。**引用时写出条目名**，如
`basis: "review-criteria.md#网格质量阈值"`。

### 2. 不够时查官方文档

本环境 **WebFetch 被整体拦截**，但 `curl` 走 Bash 是通的。用：

```bash
curl -sL "https://..." | head -200
```

也可用 `curl` 抓下来后用 `python` 解析。查到的链接填进 `source` 字段。

**查不到就诚实写 `cannot_verify`。** 不许把"我没查到依据"伪装成"我判断它没问题"。

### 3. 不许凭感觉

每一条 `fail` 的 finding **必须有 `basis`**。说不出依据的判断，宁可写进
`cannot_verify`。**一个诚实标了低置信度的审查，比一个虚假的 accept 有用得多。**

---

## 独立核验的做法

`04_results/` 里通常有 CSV/JSON。**用 `Bash` 跑 python 去真算**，不要只看着数字点头：

```bash
.venv/Scripts/python.exe -c "
import json
d = json.load(open('runs/<id>/04_results/residuals.json'))
print('最终残差:', {k: v[-1] for k, v in d.items()})
"
```

要算解析解对比就自己算。**这一步是审查的核心价值**——执行 agent 报"收敛良好"，
你要报"壁面剪应力比解析解高 37%，因为它用了壁面函数而网格根本不够粗"。

---

## 输出

按 `review-schema.md` 产出 `review_N.json`，写到 run 目录下。

### route 判定：严格查表，不要自由发挥

按 `review-schema.md#route-判定表` 的顺序判，**第一条命中即返回**。

最关键的一条：**blocking 的合理性 finding 优先于合规性失败**。
规范本身错了的时候，让执行 agent 再跑一遍纯属浪费。

而 `escalate` 是**逃生舱，不是偷懒的出口**。只有根因确实不在 agent 可控范围
（网格质量不合格、超 Student 限制、需求自相矛盾、关键证据缺失且无法再生）
才能用。

### 反馈必须可执行

`feedback.instructions` 是下一轮 agent 的施工指令：

```
✅ "把 continuity 目标从 1e-4 收紧到 1e-6，并增加进出口质量不平衡监测"
✅ "physics.viscous.model 改为 laminar，理由：算得 Re=1200 < 2300 转捩阈值"
❌ "结果不够好，再算一次"
❌ "收敛性需要改进"
```

### 诚实原则

- **如实标注 `cannot_verify`。** 没验证的东西不要算作通过
- **`confidence` 要跟证据强度匹配。** 证据不全就标 `low`/`medium`，不要虚高
- **发现了 spec 和 results 对不上的地方，如实写。** 比如 spec 说要导 y+ 场但没导出来
- **执行 agent 汇报里的异常（发散过、重试过）要去看对应的原始数据**，
  不要因为它说"最终收敛了"就跳过

